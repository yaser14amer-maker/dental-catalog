<title>ستون بير اسود ويل صغير - DX012</title>
<style>
:root {
  --paper: #f2efe9;
  --ink: #22201b;
  --steel: #3d6b78;
  --steel-dark: #2a4c56;
  --line: #d8d2c4;
  --price-bg: #22201b;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Tahoma", "Segoe UI", sans-serif;
  direction: rtl;
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #fff;
  box-shadow: 0 0 40px rgba(0,0,0,0.06);
}

.photo {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  background: #e7e2d6;
}

.body {
  padding: 24px 22px 32px;
}

.code-tag {
  display: inline-block;
  font-family: "Courier New", monospace;
  font-size: 13px;
  letter-spacing: 0.03em;
  color: var(--steel-dark);
  border: 1px solid var(--steel);
  border-radius: 3px;
  padding: 3px 9px;
  margin-bottom: 14px;
  direction: ltr;
}

h1 {
  margin: 0 0 18px;
  font-size: 27px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink);
}

.price-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 18px;
}

.price-label {
  font-size: 14px;
  color: #6b6455;
}

.price-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--steel-dark);
}

.footer-strip {
  height: 6px;
  background: linear-gradient(90deg, var(--steel), var(--steel-dark));
}

</style>
