* { box-sizing: border-box; }

html, body {

  margin-bottom: 14px;
  direction: ltr;
}

  font-weight: 700;

}

.price-row {

  justify-content: space-between;

.price-label {

  color: #6b6455;
}

.price-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--steel-dark);
}

.footer-strip {
  height: 6px;
  background: linear-gradient(90deg, var(--steel), var(--steel-dark));
}
