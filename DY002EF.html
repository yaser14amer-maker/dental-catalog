<style>
:root {

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Tahoma", "Segoe UI", sans-serif;
  direction: rtl;
}

.wrap {

  margin: 0 auto;
  min-height: 100vh;

  display: block;
  background: #e7e2d6;
}

.body {

}

.code-tag {

  font-size: 13px;
  letter-spacing: 0.03em;
  color: var(--steel-dark);
  border: 1px solid var(--steel);
  border-radius: 3px;
  padding: 3px 9px;
  margin-bottom: 14px;
  direction: ltr;
}

h1 {
  margin: 0 0 18px;
  font-size: 27px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink);
}

.price-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 18px;
}

.price-label {
  font-size: 14px;
  color: #6b6455;
}

.price-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--steel-dark);
}

.footer-strip {
  height: 6px;
  background: linear-gradient(90deg, var(--steel), var(--steel-dark));
}

</style>
