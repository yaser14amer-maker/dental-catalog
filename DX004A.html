* { box-sizing: border-box; }

html, body {

  padding: 3px 9px;
  margin-bottom: 14px;
  direction: ltr;
}

h1 {
  margin: 0 0 18px;
  font-size: 27px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink);
}

.price-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 18px;
}

.price-label {

  color: #6b6455;
}

.price-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--steel-dark);
}

.footer-strip {
  height: 6px;
  background: linear-gradient(90deg, var(--steel), var(--steel-dark));
}
